# Woodpecker CI Pipeline — zetenadev/landing
# Pola: BCD (Build-Containerize-Deploy)
# Trigger: push ke branch main → build di VPS via Woodpecker agent
#
# ⚠️  Docker socket tersedia karena WOODPECKER_AGENT_VOLUMES di agent config.
#     TIDAK perlu volumes: di sini, TIDAK perlu repo di-set Trusted.

when:
  event: push
  branch: main

steps:
  # ─────────────────────────────────────────
  # Step 1: Build Next.js Static Export
  # Output: ./out/
  # ─────────────────────────────────────────
  - name: build
    image: node:20-alpine
    commands:
      - npm ci --prefer-offline
      - npm run build

  # ─────────────────────────────────────────
  # Step 2: Containerize + Deploy
  # Docker socket sudah di-mount via WOODPECKER_AGENT_VOLUMES di VPS
  # ─────────────────────────────────────────
  - name: deploy
    image: docker:cli
    # Uncomment jika repo sudah di-set Trusted di Woodpecker admin panel:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      # Build Docker image dari hasil ./out/
      - docker build -t zetenadev-landing:latest .

      # Restart service via compose di VPS
      - docker compose -f /root/docker-stack/projects/zetenadev/landing/docker-compose.yml up -d --pull never

      # Bersihkan image lama
      - docker image prune -f
