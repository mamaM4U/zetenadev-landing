# Woodpecker CI Pipeline — zetenadev/landing
# Mendukung 2 Environments:
# - UAT (zetena.my.id) di branch release-candidate (Void CI runner local socket)
# - Prod (zetenadev.com) di branch main (Nova via SCP + SSH remote deploy)

when:
  event: push
  branch:
    - main
    - release-candidate

steps:
  # ─────────────────────────────────────────
  # Step 1: Build Next.js Static Export
  # Output: ./out/
  # Dijalankan untuk semua branch
  # ─────────────────────────────────────────
  - name: build
    image: node:20-alpine
    commands:
      - npm ci --prefer-offline
      - npm run build

  # ─────────────────────────────────────────
  # UAT DEPLOY (Void Lokal / branch: release-candidate)
  # Akses Docker host socket via Trusted Volumes
  # ─────────────────────────────────────────
  - name: deploy-uat
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -t zetenadev-landing:latest .
      - docker rm -f zetenadev-landing || true
      - docker compose -f deploy/docker-compose.uat.yml up -d --pull never
      - docker image prune -f
    when:
      branch: release-candidate

  # ─────────────────────────────────────────
  # PROD DEPLOY (Nova Remote / branch: main)
  # Menggunakan SSH Protocol
  # ─────────────────────────────────────────
  # Upload static files via SCP
  - name: deploy-prod-upload
    image: appleboy/drone-scp
    settings:
      host:
        from_secret: NOVA_SSH_HOST
      username:
        from_secret: NOVA_SSH_USER
      key:
        from_secret: NOVA_SSH_KEY
      port:
        from_secret: NOVA_SSH_PORT
      target: /root/docker-stack/projects/zetenadev/landing/public
      source: out/*
      strip_components: 1
    when:
      branch: main

  # Restart target container via SSH
  - name: deploy-prod-restart
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: NOVA_SSH_HOST
      username:
        from_secret: NOVA_SSH_USER
      key:
        from_secret: NOVA_SSH_KEY
      port:
        from_secret: NOVA_SSH_PORT
      script:
        - docker restart zetenadev-landing
    when:
      branch: main
