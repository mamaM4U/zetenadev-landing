# docker-compose.prod.yml
# Lokasi Eksekusi: Nova (Production)
# Domain: zetenadev.com
# ⚠️  File ini dijalankan sekali secara manual di VPS Nova karena pipeline hanya update public folder.

services:
  landing:
    image: joseluisq/static-web-server:2-alpine
    container_name: zetenadev-landing
    restart: unless-stopped
    volumes:
      - /root/docker-stack/projects/zetenadev/landing/public:/public
    environment:
      - SERVER_ROOT=/public
      - SERVER_PORT=80
      - SERVER_HOST=0.0.0.0
    networks:
      - infra-network
    labels:
      caddy: zetenadev.com
      caddy.reverse_proxy: "{{upstreams 80}}"

networks:
  infra-network:
    external: true
